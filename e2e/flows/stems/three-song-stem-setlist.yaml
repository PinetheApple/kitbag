appId: com.kitbag.app
name: '#382: a setlist of three stem songs and a metronome song plays from 1 and steps through, from the player and the metronome'
tags:
  - issue-382
env:
  SETLIST: Stems gig
---
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow:
    file: ../../subflows/import-stem-song.yaml
    env:
      STEM_SONG: ${FIXTURE_STEMS}
- back
- runFlow:
    file: ../../subflows/import-stem-song.yaml
    env:
      STEM_SONG: ${FIXTURE_STEMS_LONG_NO_GRID}
- runFlow:
    file: ../../subflows/add-stem-song-to-setlist.yaml
    env:
      STEM_SONG: ${FIXTURE_STEMS}
- runFlow:
    file: ../../subflows/add-stem-song-to-setlist.yaml
    env:
      STEM_SONG: ${FIXTURE_STEMS_LONG_NO_GRID}
- runFlow:
    file: ../../subflows/add-stem-song-to-setlist.yaml
    env:
      STEM_SONG: ${FIXTURE_STEMS}
- back
- runFlow: ../../subflows/open-metronome-first-time.yaml
- runFlow:
    file: ../../subflows/set-tempo.yaml
    env:
      BPM: 120
- tapOn: 'Setlists'
- tapOn: '${SETLIST}, .*'
- runFlow:
    file: ../../subflows/add-new-song-to-setlist.yaml
    env:
      BPM: 120
- assertVisible: '1\. ${FIXTURE_STEMS}, stem song.*'
- assertVisible: '2\. ${FIXTURE_STEMS_LONG_NO_GRID}, stem song.*'
- assertVisible: '3\. ${FIXTURE_STEMS}, stem song.*'
- assertVisible: '4\. New song, 120 · .*'
- tapOn: 'Play from 1'
- extendedWaitUntil:
    visible: 'Up next: ${FIXTURE_STEMS_LONG_NO_GRID}, ${SETLIST} · 2 of 4'
    timeout: 20000
- assertVisible: 'Play'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Next: ${FIXTURE_STEMS_LONG_NO_GRID}'
- extendedWaitUntil:
    visible: 'Up next: ${FIXTURE_STEMS}, ${SETLIST} · 3 of 4'
    timeout: 20000
- assertVisible: 'Pause'
# Next plays the song it steps to; pausing keeps it from ending under the steps below.
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Pause'
- extendedWaitUntil:
    visible: 'Play'
    timeout: 10000
- back
- assertVisible: '2\. ${FIXTURE_STEMS_LONG_NO_GRID}, stem song.*, now loaded'
- back
- back
- extendedWaitUntil:
    visible: '${FIXTURE_STEMS_LONG_NO_GRID}, Setlist ${SETLIST}, song 2 of 4'
    timeout: 10000
- tapOn: 'Next song, ${FIXTURE_STEMS}'
- extendedWaitUntil:
    visible: 'Up next: New song, ${SETLIST} · 4 of 4 · metronome'
    timeout: 20000
- back
- tapOn: 'Next song, New song'
- extendedWaitUntil:
    visible: 'New song, Setlist ${SETLIST}, song 4 of 4'
    timeout: 10000
- tapOn: 'Play'
- extendedWaitUntil:
    visible: 'Stop'
    timeout: 5000
- tapOn: 'Previous song, ${FIXTURE_STEMS}'
- extendedWaitUntil:
    visible: 'Up next: New song, ${SETLIST} · 4 of 4 · metronome'
    timeout: 20000
- assertVisible: 'Play'
- tapOn: 'Open'
- extendedWaitUntil:
    visible: 'New song, Setlist ${SETLIST}, song 4 of 4'
    timeout: 10000
- assertVisible: 'Play'
- assertNotVisible: 'Stop'
