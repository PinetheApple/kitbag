appId: com.kitbag.app
name: '#609: the click-sound rename sheet, opened again and again, shows its card with the name field focused'
tags:
  - issue-609
env:
  ITERATIONS: 50
---
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/open-metronome-first-time.yaml
- tapOn: 'Practice tools(, \d+ on)?'
- tapOn: 'Accent sound, Tick'
- tapOn: 'Import a sound'
- runFlow:
    file: ../../subflows/pick-download.yaml
    env:
      FILE: '${FIXTURE_SOUND}.wav'
- extendedWaitUntil:
    visible: '${FIXTURE_SOUND}, your sound'
    timeout: 20000
- evalScript: ${output.iteration = 0}
- repeat:
    times: ${ITERATIONS}
    commands:
      - evalScript: ${output.iteration = output.iteration + 1}
      - tapOn: 'Options for ${FIXTURE_SOUND}'
      - tapOn: 'Rename'
      - assertVisible:
          label: 'Rename field focused, ${output.iteration} of ${ITERATIONS}'
          text: 'New name for ${FIXTURE_SOUND}'
          focused: true
      - tapOn: 'Cancel'
      - assertNotVisible: 'New name for ${FIXTURE_SOUND}'
