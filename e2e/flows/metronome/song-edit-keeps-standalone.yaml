appId: com.kitbag.app
name: '#369 2: editing a loaded song leaves the standalone settings and the saved song alone'
tags:
  - pr-369
---
- runFlow: ../../subflows/song-loaded-over-standalone.yaml
- runFlow:
    file: ../../subflows/set-tempo.yaml
    env:
      BPM: 140
- runFlow:
    file: ../../subflows/relaunch-expect-tempo.yaml
    env:
      BPM: 125
- assertNotVisible: 'New song, .*not in a setlist'
- runFlow: ../../subflows/open-all-songs.yaml
- assertVisible: 'New song, 130 · .*'
