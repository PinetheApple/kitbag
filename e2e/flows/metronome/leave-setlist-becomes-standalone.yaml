appId: com.kitbag.app
name: "#369 5: after Leave setlist the song's settings are the standalone ones across a force-stop"
tags:
  - pr-369
---
- runFlow: ../../subflows/setlist-over-standalone.yaml
- runFlow:
    file: ../../subflows/load-setlist-song.yaml
    env:
      POSITION: 2
      BPM: 120
- runFlow:
    file: ../../subflows/set-tempo.yaml
    env:
      BPM: 140
- runFlow:
    file: ../../subflows/set-time-signature.yaml
    env:
      BEATS: 7
      UNIT: 8
- tapOn: 'New song(, unsaved changes)?, Setlist Gig, song 2 of 2'
- tapOn: 'Leave setlist'
- extendedWaitUntil:
    visible: 'Setlists, none active'
    timeout: 10000
- assertVisible: 'Tempo, 140 BPM'
- runFlow:
    file: ../../subflows/relaunch-expect-tempo.yaml
    env:
      BPM: 140
- assertVisible: 'Time signature, 7 over 8'
- assertVisible: 'Setlists, none active'
