appId: com.kitbag.app
name: '#370: a bar tap opens the player once, attached to the playing song'
tags:
  - pr-370
---
- runFlow: ../../subflows/song-playing-behind-bar.yaml
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Open ${FIXTURE_SONG}'
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 5000
- assertNotVisible: 'Open ${FIXTURE_SONG}'
- back
- extendedWaitUntil:
    visible: 'Import a song'
    timeout: 5000
- assertVisible: 'Pause ${FIXTURE_SONG}'
