appId: com.kitbag.app
name: '#370: deleting the playing song from Songs ends the session'
tags:
  - pr-370
---
- runFlow: ../../subflows/song-playing-behind-bar.yaml
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Actions for ${FIXTURE_SONG}'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Delete song'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Delete'
- extendedWaitUntil:
    notVisible: 'Open ${FIXTURE_SONG}'
    timeout: 5000
- assertNotVisible: '${FIXTURE_SONG}, .*'
- back
- extendedWaitUntil:
    visible: 'Metronome, .*(ready|playing)'
    timeout: 5000
- assertNotVisible: 'Open ${FIXTURE_SONG}'
