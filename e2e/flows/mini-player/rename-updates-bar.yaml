appId: com.kitbag.app
name: '#370: renaming the playing song updates the bar'
tags:
  - pr-370
---
- runFlow: ../../subflows/song-playing-behind-bar.yaml
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Actions for ${FIXTURE_SONG}'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Rename'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'New name for ${FIXTURE_SONG}'
- eraseText
- inputText: 'Renamed'
- runFlow:
    file: ../../subflows/tap-while-playing.yaml
    env:
      TARGET: 'Save the new name for ${FIXTURE_SONG}'
- hideKeyboard
- extendedWaitUntil:
    visible: 'Pause Renamed'
    timeout: 5000
- assertNotVisible: 'Open ${FIXTURE_SONG}'
