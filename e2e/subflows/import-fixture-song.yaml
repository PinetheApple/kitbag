appId: com.kitbag.app
---
- tapOn: 'Songs, .*'
- tapOn: 'Import( a song)?'
- runFlow:
    when:
      notVisible: '${FIXTURE_SONG}.wav'
    commands:
      - tapOn: 'Show roots'
      - tapOn: 'Downloads'
- scrollUntilVisible:
    element: '${FIXTURE_SONG}.wav'
- tapOn: '${FIXTURE_SONG}.wav'
- extendedWaitUntil:
    visible: '${FIXTURE_SONG}, .*'
    timeout: 20000
