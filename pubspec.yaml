name: kitbag_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/core_plugin_api
  - packages/core_audio_ffi
  - packages/core_db
  - packages/core_design
  - packages/core_services
  - packages/app_shell
  - packages/custom_lint_kitbag
  - packages/tool_metronome
  - packages/tool_tuner

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      run: dart run melos exec -- dart analyze --fatal-infos
      description: Analyze all packages.
    test:
      run: dart run melos exec --dir-exists=test -- flutter test
      description: Test all packages that have tests.
    format:
      run: dart run melos exec -- dart format --set-exit-if-changed .
      description: Verify formatting.
    gen:
      run: dart run melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
      description: Run code generation (drift) where needed. Generated *.g.dart files are gitignored, so run this after a fresh checkout before analyze/test.
