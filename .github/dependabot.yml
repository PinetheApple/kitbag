# The Expo SDK pins the RN stack and Android toolchain; they move only via `expo install --check`.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /packages/app-shell/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'gradle-wrapper'
      - dependency-name: 'com.android.tools.build:gradle'
      - dependency-name: 'org.jetbrains.kotlin:*'

  - package-ecosystem: gradle
    directory: /packages/core-native/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'gradle-wrapper'
      - dependency-name: 'com.android.tools.build:gradle'
      - dependency-name: 'org.jetbrains.kotlin:*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - '*'
