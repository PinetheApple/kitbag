# Majors of the RN/Expo stack and its pinned Android toolchain move only in a planned upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /packages/app-shell/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'gradle-wrapper'
      - dependency-name: 'com.android.tools.build:gradle'
      - dependency-name: 'org.jetbrains.kotlin:*'

  - package-ecosystem: gradle
    directory: /packages/core-native/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'gradle-wrapper'
      - dependency-name: 'com.android.tools.build:gradle'
      - dependency-name: 'org.jetbrains.kotlin:*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - '*'
