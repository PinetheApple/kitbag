name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Flutter app is gone (SPEC.md §13 — the stack is React Native + TypeScript).
# The native core is the only buildable target today; the RN jobs land with the app.
jobs:
  native:
    name: Native core (Linux)
    runs-on: ubuntu-latest
    # audio_source_verify's TestDestroyWhileRunning hangs rather than fails on a
    # join deadlock; without this it burns the default runner limit instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S native/audio_core -B native/audio_core/build -G Ninja -DKITBAG_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build native/audio_core/build
      - name: Metronome — render offline, assert onsets against the beat grid
        run: ./native/audio_core/build/metronome_verify
      - name: ABI — exercise the exported C surface against the shared library
        run: ./native/audio_core/build/abi_verify
      - name: Beat tracker — synthetic onsets, assert tempo and beat times
        run: ./native/audio_core/build/beat_tracker_verify
      - name: Mixer — transport and mix-down
        run: ./native/audio_core/build/mixer_verify
      - name: Player — single-source transport advances, holds on pause, seeks
        run: ./native/audio_core/build/player_verify
      - name: Seek race — a live seek never emits a stale/underflowed block (#25)
        run: ./native/audio_core/build/seek_race_verify
      - name: Stream — a real WAV streams through the C ABI; frames, non-silence, resample
        run: ./native/audio_core/build/stream_verify
      - name: Note lock — hysteresis around note boundaries
        run: ./native/audio_core/build/note_lock_verify
      - name: Audio source — the SourceReader seam, no miniaudio linked
        run: ./native/audio_core/build/audio_source_verify
      - name: File reader — the miniaudio side of the seam, over a run-time WAV
        run: ./native/audio_core/build/file_audio_reader_verify
      - name: Decoder — the offline kb_analyze_song path decodes s16 to f32
        run: ./native/audio_core/build/decoder_verify
      - name: Analyze — Decoder→downmix→tracker→sidecar; NaN/channels/narrowing guards
        run: ./native/audio_core/build/analyze_verify
      # tuner_verify is NOT gated: it currently fails 37/37 — PitchAnalyzer
      # returns 0 Hz / 0.00 confidence on clean synthetic tones. See SPEC §10.1.
      # Re-enable as a gate when the tuner research lands.
      - name: Tuner — render offline (informational, known failing)
        run: ./native/audio_core/build/tuner_verify || true

  # The TypeScript workspace (Phase 2, SPEC §13/§13.6). Runs the same gate the
  # project loop runs locally: typecheck, the architecture-rule lint, the
  # one-owner generation drift guards (§13.7/§13.8.1), and every vitest suite —
  # including the lint eval harness that proves the custom rules actually fire.
  js:
    name: JS/TS workspace (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck — all packages
        run: pnpm -w typecheck
      - name: Lint — architecture rules + generic, --max-warnings 0
        run: pnpm -w lint
      # Without a gate, prettier drift accumulates until someone runs
      # scripts/format.sh and sweeps unrelated files into a feature commit.
      - name: Format — prettier --check, honouring .prettierignore
        run: pnpm -w format
      - name: Generated native constants are not stale (§13.7)
        run: pnpm --filter @kitbag/core-native generate:check
      - name: Generated Tailwind theme is not stale (§13.8.1)
        run: pnpm --filter @kitbag/core-design generate:check
      - name: Tests — unit suites + the lint eval harness (§13.6)
        run: pnpm -w test
