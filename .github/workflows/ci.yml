name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S native/audio_core -B native/audio_core/build -G Ninja -DKITBAG_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build native/audio_core/build

  dart:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Generate code (*.g.dart is gitignored)
        run: dart run melos gen
      - name: Format
        run: dart run melos format
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Generate code (*.g.dart is gitignored)
        run: dart run melos gen
      - name: Build release APK
        working-directory: packages/app_shell
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitbag-release-apk
          path: packages/app_shell/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
