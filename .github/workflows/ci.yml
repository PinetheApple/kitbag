name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# The Flutter app is gone (SPEC.md §13 — the stack is React Native + TypeScript).
# The native core is the only buildable target today; the RN jobs land with the app.
jobs:
  native:
    name: Native core (Linux)
    runs-on: ubuntu-24.04
    # audio_source_verify's TestDestroyWhileRunning hangs rather than fails on a
    # join deadlock; without this it burns the default runner limit instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S native/audio_core -B native/audio_core/build -G Ninja -DKITBAG_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build native/audio_core/build
      - name: Metronome — render offline, assert onsets against the beat grid
        run: ./native/audio_core/build/metronome_verify
      - name: ABI — exercise the exported C surface against the shared library
        run: ./native/audio_core/build/abi_verify
      - name: Beat tracker — synthetic onsets, assert tempo and beat times
        run: ./native/audio_core/build/beat_tracker_verify
      - name: Mixer — transport and mix-down
        run: ./native/audio_core/build/mixer_verify
      - name: Player — single-source transport advances, holds on pause, seeks
        run: ./native/audio_core/build/player_verify
      - name: Seek race — a live seek never emits a stale/underflowed block (#25)
        run: ./native/audio_core/build/seek_race_verify
      - name: Stream — a real WAV streams through the C ABI; frames, non-silence, resample
        run: ./native/audio_core/build/stream_verify
      - name: Stem sync — the click follows the stems through seek, pause and loop wraps
        run: ./native/audio_core/build/stem_sync_verify
      - name: Audio source — the SourceReader seam, no miniaudio linked
        run: ./native/audio_core/build/audio_source_verify
      - name: File reader — the miniaudio side of the seam, over a run-time WAV
        run: ./native/audio_core/build/file_audio_reader_verify
      - name: Decoder — the offline kb_analyze_song path decodes s16 to f32
        run: ./native/audio_core/build/decoder_verify
      - name: Analyze — streamed analysis matches the whole-buffer reference; NaN/channels guards
        run: ./native/audio_core/build/analyze_verify
      - name: Analyze memory — heap growth per second of audio stays bounded
        run: ./native/audio_core/build/analyze_memory_verify
      - name: Tuner — synthetic tones through the detector and the tuning mode
        run: ./native/audio_core/build/tuner_verify
      - name: Click soak — dropped/doubled/jittered/offset fixtures and the engine's render
        run: ./native/audio_core/build/click_soak_verify
      - name: Stretch — duration scales by 1/rate, pitch holds, shifts land, no allocation
        run: ./native/audio_core/build/stretch_verify
      - name: Mixdown — the offline stem mix renders exactly, stretches, cleans up and stays bounded
        run: ./native/audio_core/build/mixdown_verify

  # The TypeScript workspace (Phase 2, SPEC §13/§13.6). Runs the same gate the
  # project loop runs locally: typecheck, the architecture-rule lint, the
  # one-owner generation drift guards (§13.7/§13.8.1), and every vitest suite —
  # including the lint eval harness that proves the custom rules actually fire.
  js:
    name: JS/TS workspace (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck — all packages
        run: pnpm -w typecheck
      - name: Lint — architecture rules + generic, --max-warnings 0
        run: pnpm -w lint
      # Without a gate, prettier drift accumulates until someone runs
      # scripts/format.sh and sweeps unrelated files into a feature commit.
      - name: Format — prettier --check, honouring .prettierignore
        run: pnpm -w format
      - name: Generated native constants are not stale (§13.7)
        run: pnpm --filter @kitbag/core-native generate:check
      - name: Generated Tailwind theme is not stale (§13.8.1)
        run: pnpm --filter @kitbag/core-design generate:check
      - name: Tests — unit suites + the lint eval harness (§13.6)
        run: pnpm -w test
      - name: Web bundle — exports, no native-only modules (#70)
        run: ./scripts/web-check.sh
      - name: Version — app.json and its package.json mirrors agree (#53)
        run: ./scripts/version.sh check
      - name: Script tests
        run: ./scripts/version.test.sh && ./scripts/verify-apk-signature.test.sh && ./scripts/release-gate.test.sh && ./scripts/changelog.test.sh && ./scripts/release-notes.test.sh && ./scripts/preflight.test.sh && ./scripts/lint.test.sh && ./scripts/e2e.test.sh

  # The only gate that compiles Kotlin, the JNI glue and the codegen'd
  # TurboModule spec together. Every headless gate stayed green from M1 to M3
  # while that chain was broken, because nothing but a Gradle build touches it.
  # No secrets: an unset ANDROID_KEYSTORE_* means a debug-signed APK, which is
  # what CI wants and what scripts/verify-apk-signature.sh refuses to publish.
  android:
    name: Android release build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      e2e: ${{ steps.e2e.outputs.run }}
      all-flows: ${{ steps.changes.outputs.app }}
      flows: ${{ steps.changes.outputs.flows_files }}
    # CMake reads the launchers from the environment, so no build.gradle changes.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 1G
      # Gradle reinstalls the NDK every run, so its mtime never matches.
      CCACHE_COMPILERCHECK: '%compiler% --version'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changes — does this commit need the device flows
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            app:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'e2e/subflows/**'
              - 'e2e/shards'
              - 'e2e/make_click_song.py'
              - 'scripts/e2e.sh'
              - 'scripts/install-maestro.sh'
              - '.github/workflows/ci.yml'
            flows:
              - added|modified: 'e2e/flows/**/*.yaml'
      - name: Device flows — whether they run, and the emulator's ABI added to the build
        id: e2e
        env:
          RUN: ${{ steps.changes.outputs.app == 'true' || steps.changes.outputs.flows == 'true' }}
        run: |
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          [[ $RUN == true ]] || exit 0
          abis=$(sed -n 's/^reactNativeArchitectures=//p' packages/app-shell/android/gradle.properties)
          echo "ABI_ARGS=-PreactNativeArchitectures=$abis,x86_64" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ccache-restore
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: ccache — zero the restored stats so the report covers this build only
        run: ccache --zero-stats
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # assembleRelease, not assembleDebug: it bundles the JS and runs the
      # release-only Gradle paths (signing config selection, versionName from
      # app.json) that a debug build never exercises.
      - name: Assemble release — compiles the Kotlin/JNI/codegen chain
        run: ./gradlew :app:assembleRelease :kitbag_core-native:testReleaseUnitTest ${ABI_ARGS:-}
        working-directory: packages/app-shell/android
      - name: versionCode — build.gradle's formula agrees with version.sh
        run: >-
          ./scripts/release-gate.sh --version-only
          packages/app-shell/android/app/build/outputs/apk/release/app-release.apk
          "$(./scripts/version.sh current)"
      - name: ccache — hit rate for this build
        run: ccache --show-stats
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.e2e.outputs.run == 'true'
        with:
          name: e2e-apk
          path: packages/app-shell/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  e2e-shard:
    name: Device flows — shard ${{ matrix.shard }}
    needs: android
    if: needs.android.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      AVD_API_LEVEL: 35
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
      AVD_RAM: 2048M
      AVD_PROFILE: pixel_6
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM — let the runner user open /dev/kvm
        run: |
          rules="$RUNNER_TEMP/99-kvm4all.rules"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' > "$rules"
          sudo install -m 644 "$rules" /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.maestro
          key: maestro-${{ hashFiles('scripts/install-maestro.sh') }}
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk
          path: apk
      - name: Flows — this shard's slice of e2e/shards, or its share of the changed flows
        id: flows
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          ALL_FLOWS: ${{ needs.android.outputs.all-flows }}
          CHANGED_FLOWS: ${{ needs.android.outputs.flows }}
        run: |
          mapfile -t slices < e2e/shards
          ((${#slices[@]} == SHARDS)) || {
            echo "e2e/shards has ${#slices[@]} lines for $SHARDS shards" >&2
            exit 1
          }
          listed=$(tr ' ' '\n' < e2e/shards | sed '/^$/d' | sort)
          present=$(find e2e/flows -name '*.yaml' | sed 's|^e2e/flows/||; s|\.yaml$||' | sort)
          [[ $listed == "$present" ]] || {
            echo "e2e/shards must list every flow under e2e/flows once:" >&2
            diff <(echo "$listed") <(echo "$present") >&2
            exit 1
          }
          flows=()
          if [[ $ALL_FLOWS == true ]]; then
            read -ra flows <<<"${slices[SHARD - 1]}"
          else
            mapfile -t changed < <(jq -r '.[]' <<<"$CHANGED_FLOWS")
            for i in "${!changed[@]}"; do
              [[ ${changed[i]} =~ ^e2e/flows/[A-Za-z0-9/_.-]+\.yaml$ ]] || {
                echo "unexpected flow path: ${changed[i]}" >&2
                exit 1
              }
              ((i % SHARDS == SHARD - 1)) && flows+=("${changed[i]}")
            done
          fi
          echo "E2E_FLOWS=${flows[*]}" >> "$GITHUB_ENV"
          echo "run=$((${#flows[@]} > 0))" >> "$GITHUB_OUTPUT"
          echo "shard $SHARD/$SHARDS flows: ${flows[*]:-none}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.flows.outputs.run == 1
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v2-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-${{ env.AVD_RAM }}
      - name: AVD — create it and save a boot snapshot for the cache
        if: steps.flows.outputs.run == 1 && steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          ram-size: ${{ env.AVD_RAM }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot saved"
      - name: Device flows — install the APK, run the flows, name any failing step
        if: steps.flows.outputs.run == 1
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          ram-size: ${{ env.AVD_RAM }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: bash scripts/e2e.sh --out "$E2E_OUT" apk/app-release.apk $E2E_FLOWS
      # Maestro names its folders after the flows, and artifact paths may not hold their colons.
      - name: Maestro output — pack it for the artifact
        if: always() && steps.flows.outputs.run == 1
        run: tar -czf "$E2E_OUT/maestro.tar.gz" -C "$E2E_OUT" maestro
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.flows.outputs.run == 1
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            ${{ env.E2E_OUT }}/*.png
            ${{ env.E2E_OUT }}/logcat.txt
            ${{ env.E2E_OUT }}/report.xml
            ${{ env.E2E_OUT }}/maestro.tar.gz
          retention-days: 14

  # The one check name a ruleset can require, whatever the shard count.
  e2e:
    name: Device flows (Android emulator)
    needs: [android, e2e-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Shards — every one passed, or no app code or flow changed
        env:
          ANDROID: ${{ needs.android.result }}
          NEEDED: ${{ needs.android.outputs.e2e }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [[ $ANDROID == success && $NEEDED != true ]]; then
            echo "no app code or flow changed; no shard ran"
            exit 0
          fi
          [[ $SHARDS == success ]] || {
            echo "shards: $SHARDS, android: $ANDROID" >&2
            exit 1
          }
