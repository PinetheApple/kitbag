name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S native/audio_core -B native/audio_core/build -G Ninja -DKITBAG_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build native/audio_core/build

  dart:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Format
        run: dart run melos format
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test
