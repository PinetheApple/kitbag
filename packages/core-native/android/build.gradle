// Codegen runs here so only this package owns the TurboModule surface; this module's
// CMake is the single build of kitbag_core (the app must not run it too).

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def reactNativeAbis = project.property('reactNativeArchitectures').toString().split(',')*.trim()

android {
  namespace "com.kitbag.corenative"
  // AGP 9 only creates unit-test tasks for the tested build type; CI runs testReleaseUnitTest.
  testBuildType "release"

  compileSdk rootProject.ext.compileSdkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  ndkVersion rootProject.ext.ndkVersion

  buildFeatures {
    prefab true
    buildConfig true
  }

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20"
        // 16 KB pages reject 4 KB-aligned .so at install (#33); set here, not in audio_core,
        // because that tree also builds host tools where this linker flag is wrong.
        arguments "-DANDROID_STL=c++_shared",
                  "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
        abiFilters(*reactNativeAbis)
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  sourceSets {
    main {
      java {
        srcDirs += "${project.buildDir}/generated/source/codegen/java"
      }
    }
  }

  packagingOptions {
    // React Native ships these itself; re-packaging them fails the app build on duplicates.
    excludes = [
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libreactnative.so",
    ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.media:media:1.7.0"
  implementation "androidx.work:work-runtime:2.12.0"
  implementation "com.google.zxing:core:3.5.4"
  def camerax = "1.6.2"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  testImplementation "junit:junit:4.13.2"
  // android.jar stubs org.json to throw; the bundle parsers need the real one under test.
  testImplementation "org.json:json:20260814"
}
