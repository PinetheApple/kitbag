name: app_shell
description: Kitbag — the open-source everything-app for musicians.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  flutter_local_notifications: ^18.0.0
  file_picker: ^8.0.0
  go_router: ^16.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  core_plugin_api:
  core_audio_ffi:
  core_db:
  core_design:
  core_services:
  tool_metronome:
  tool_library:
  tool_stems:
  tool_sync:
  tool_tuner:

dev_dependencies:
  custom_lint: ^0.8.1
  custom_lint_kitbag:
    path: ../custom_lint_kitbag
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
